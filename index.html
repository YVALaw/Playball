<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets env(safe-area-inset-*) report real values
         on a notched Android device. Without it the gesture bar sits on the nav.
         maximum-scale=1 stops the browser zooming the page in when a text input
         takes focus (reported from coach creation: the zoom arrived with the
         keyboard and never left). The app is a fixed-frame game with no pinch
         content, and its inputs also hold the 16px floor so the zoom would have
         nothing to trigger on either way. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- The status bar follows the app's own paper, in either theme, so the
         installed game does not sit under a strip of browser white. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffefa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121711" />
    <title>Playball</title>
    <!-- Installable: what turns "a tab" into a launcher icon that opens
         fullscreen, with no URL bar. Stage 18 wraps this same bundle in
         Capacitor; until then this is how the emulator and a phone hold it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Playball" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
