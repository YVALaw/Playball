<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 64 64" width="{{ size }}" height="{{ size }}" style="display:block;border-radius:50%;background:#f2ece0" aria-hidden="true">
  <path d="M8 64 C8 50 20 44 32 44 C44 44 56 50 56 64 Z" fill="{{ jersey }}"></path>
  <path d="M26 45 L32 54 L38 45 L34 44 L32 47 L30 44 Z" fill="#f6f1e6"></path>
  <text x="32" y="61" text-anchor="middle" style="font:700 9px 'IBM Plex Mono',monospace;fill:#f6f1e6;opacity:.9">{{ shirt }}</text>
  <rect x="27" y="36" width="10" height="9" rx="3" fill="{{ skin }}"></rect>
  <ellipse cx="32" cy="26" rx="13" ry="14.5" fill="{{ skin }}"></ellipse>
  <ellipse cx="19" cy="27" rx="2.4" ry="3.2" fill="{{ skin }}"></ellipse>
  <ellipse cx="45" cy="27" rx="2.4" ry="3.2" fill="{{ skin }}"></ellipse>
  <path d="M19 22 C20 13 26 11 32 11 C38 11 44 13 45 22 C42 17 36 15 32 15 C28 15 22 17 19 22 Z" fill="{{ hair }}" opacity="{{ shortOp }}"></path>
  <g fill="{{ hair }}" opacity="{{ curlsOp }}">
    <circle cx="23" cy="16" r="6"></circle>
    <circle cx="32" cy="13" r="6.5"></circle>
    <circle cx="41" cy="16" r="6"></circle>
    <circle cx="19" cy="22" r="4.5"></circle>
    <circle cx="45" cy="22" r="4.5"></circle>
  </g>
  <path d="M18 24 C17 12 25 10 32 10 C39 10 47 12 46 24 L46 36 L42 36 L42 20 C38 16 26 16 22 20 L22 36 L18 36 Z" fill="{{ hair }}" opacity="{{ longOp }}"></path>
  <g opacity="{{ capOp }}">
    <path d="M18 22 C18 12 25 9 32 9 C39 9 46 12 46 22 Z" fill="{{ jersey }}"></path>
    <path d="M17 22 L52 22 C52 25 48 26 44 26 L17 26 Z" fill="{{ jersey }}" opacity="0.85"></path>
    <circle cx="32" cy="12" r="1.8" fill="#f6f1e6" opacity="0.7"></circle>
  </g>
  <circle cx="27" cy="26" r="1.7" fill="#1c2430"></circle>
  <circle cx="37" cy="26" r="1.7" fill="#1c2430"></circle>
  <path d="M24 22 L30 21" stroke="#1c2430" stroke-width="1.4" stroke-linecap="round" opacity="0.75"></path>
  <path d="M34 21 L40 22" stroke="#1c2430" stroke-width="1.4" stroke-linecap="round" opacity="0.75"></path>
  <path d="M21 29 C21 39 26 43 32 43 C38 43 43 39 43 29 C40 36 36 38 32 38 C28 38 24 36 21 29 Z" fill="{{ hair }}" opacity="{{ beardOp }}"></path>
  <path d="M29 33 Q32 35.5 35 33" stroke="#1c2430" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.7"></path>
</svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:80},&quot;pid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;p-1042&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;jersey&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1f4d3f&quot;,&quot;options&quot;:[&quot;#1f4d3f&quot;,&quot;#8c1c2b&quot;,&quot;#1c3f6e&quot;,&quot;#a8442a&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;min&quot;:16,&quot;max&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;number&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;}}">
// Ported verbatim from src/ui/Avatar.tsx — same hash, same palettes, same cut
// list, so a player keeps his face across screens.
function hash(seed, salt) {
  let h = salt * 2654435761;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
  const v = Math.sin(h * 0.0001 + salt * 12.9898) * 43758.5453;
  return v - Math.floor(v);
}
const pick = (list, seed, salt) => list[Math.floor(hash(seed, salt) * list.length)];

const SKIN = ['#f0c9a6', '#e0ab82', '#c68a5e', '#a26b43', '#7a4e2d', '#5a3720'];
const HAIR = ['#1c1410', '#2e1f16', '#4a3121', '#6b4a2a', '#9a6b3a', '#c9a05c'];
const CUTS = ['cap', 'short', 'curls', 'long', 'cap', 'short', 'bald'];

class Component extends DCLogic {
  renderVals() {
    const id = String(this.props.pid ?? 'player');
    const cut = pick(CUTS, id, 3);
    return {
      size: this.props.size ?? 40,
      jersey: this.props.jersey ?? '#a8442a',
      skin: pick(SKIN, id, 1),
      hair: pick(HAIR, id, 2),
      shirt: String(this.props.number ?? Math.floor(hash(id, 5) * 89) + 1),
      shortOp: cut === 'short' ? 1 : 0,
      curlsOp: cut === 'curls' ? 1 : 0,
      longOp: cut === 'long' ? 1 : 0,
      capOp: cut === 'cap' ? 1 : 0,
      beardOp: hash(id, 4) > 0.78 ? 0.85 : 0,
    };
  }
}

</script>
</body>
</html>
